<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختبار الفيزياء الفولاذي - 100 سؤال ⚡</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background: #05060d;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      padding: 20px;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 900px;
      background: rgba(13, 17, 30, 0.92);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 24px;
      padding: 35px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 35px rgba(56, 189, 248, 0.2);
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 15px;
      margin-bottom: 22px;
    }

    .progress-box {
      font-size: 1.05rem;
      color: #38bdf8;
      font-weight: 700;
      background: rgba(56, 189, 248, 0.1);
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .score-box {
      font-size: 1.05rem;
      color: #4ade80;
      font-weight: 700;
    }

    .question-card {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 18px;
      padding: 25px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 20px;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
    }

    .topic-tag {
      display: inline-block;
      color: #fbbf24;
      font-size: 0.88rem;
      font-weight: bold;
      margin-bottom: 10px;
      background: rgba(251, 191, 36, 0.1);
      padding: 4px 12px;
      border-radius: 12px;
      border: 1px solid rgba(251, 191, 36, 0.2);
    }

    .question-text {
      font-size: 1.2rem;
      line-height: 1.9;
      color: #f1f5f9;
      font-weight: 600;
    }

    .hint-box {
      display: none;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-size: 0.98rem;
      line-height: 1.6;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 16px 20px;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 500;
      cursor: pointer;
      text-align: right;
      transition: all 0.3s ease;
    }

    .option-btn:hover {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(129, 140, 248, 0.2));
      border-color: #38bdf8;
      transform: translateX(-5px);
    }

    .option-btn.wrong-first {
      background: rgba(239, 68, 68, 0.25) !important;
      border-color: #ef4444 !important;
      opacity: 0.6;
      cursor: not-allowed;
    }

    .option-btn.correct {
      background: rgba(34, 197, 94, 0.3) !important;
      border-color: #22c55e !important;
    }

    .next-btn {
      display: none;
      width: 100%;
      margin-top: 20px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      color: white;
      border: none;
      padding: 15px;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .next-btn:hover {
      transform: scale(1.02);
    }

    .results-card {
      text-align: center;
      padding: 10px;
    }

    .results-title {
      font-size: 2rem;
      color: #38bdf8;
      margin-bottom: 10px;
      font-weight: 800;
    }

    .report-table {
      width: 100%;
      margin-top: 25px;
      border-collapse: collapse;
      text-align: right;
      max-height: 400px;
      display: block;
      overflow-y: auto;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
    }

    .report-table th, .report-table td {
      padding: 12px 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.95rem;
    }

    .report-table th {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      position: sticky;
      top: 0;
    }

    .status-pass { color: #4ade80; font-weight: bold; }
    .status-fail { color: #f87171; font-weight: bold; }
  </style>
</head>
<body>

  <canvas id="starsCanvas"></canvas>

  <div class="container">
    <div class="header-bar" id="headerBar">
      <div class="progress-box">📌 السؤال: <span id="currentQ">1</span> / 100</div>
      <div class="score-box">🏆 النقاط: <span id="score">0</span></div>
    </div>

    <div id="quizBox">
      <div class="question-card">
        <div class="topic-tag" id="topicTag">الدرس</div>
        <div class="question-text" id="qText">جاري تحميل السؤال...</div>
      </div>

      <div class="hint-box" id="hintBox"></div>

      <div class="options-container" id="optionsContainer"></div>

      <button class="next-btn" id="nextBtn" onclick="nextQuestion()">السؤال التالي ➔</button>
    </div>
  </div>

  <script>
    const FORMSPREE_ENDPOINT = "https://formspree.io/f/mvkganog";

    const rawQuestions = [
      {
        topic: "شدة التيار والمقاومة",
        q: "1. موصل كروي مصمت نصف قطره R وموصل آخر كروي مجوف بنفس المادة ونفس نصف القطر الخارجي R وسمك جدار الموصل المجوف t. إذا أُوصل كلاهما بنفس الفرق في الجهد بين السطحين الداخلي والخارجي، فإن نسبة المقاومة للصلب إلى المجوف هي:",
        options: ["1 : 1", "أكبر من 1", "أقل من 1", "تعتمد على قيمة t"],
        ans: 1,
        hint: "💡 تلميح: المقاومة تعتمد على المساحة العمودية لمرور التيار A. قارن مساحة مقطع الموصل المصمت بالمستعرض للمجوف."
      },
      {
        topic: "شدة التيار والمقاومة",
        q: "2. إذا زاد طول موصل بمقدار 200% نتيجة السحب المنتظم، فإن مقومته الكهربية تزداد بمقدار:",
        options: ["300%", "400%", "800%", "900%"],
        ans: 2,
        hint: "💡 تلميح: 'زاد بمقدار 200%' تعني أن الطول الجديد أصبح L2 = 3 L1. وفي السحب R تتناسب طردياً مع L²."
      },
      {
        topic: "شدة التيار والمقاومة",
        q: "3. سلكان من نفس المادة، طول الأول ضعف طول الثاني وكتلة الثاني ضعف كتلة الأول. تكون النسبة بين مقاومتيهما R1 / R2 هي:",
        options: ["8 : 1", "1 : 8", "4 : 1", "1 : 4"],
        ans: 0,
        hint: "💡 تلميح: استخدم العلاقة R = ρ * d * L² / m حيث d هي الكثافة وm هي الكتلة."
      },
      {
        topic: "شدة التيار والمقاومة",
        q: "4. يتحرك إلكترون ذرة الهيدروجين في مسار دائري نصف قطره r بسرعة v. تكون شدة التيار الكهربائي الناشئ عن حركة الإلكترون مساوية لـ:",
        options: ["e.v / (2πr)", "2πr / (e.v)", "e.v.r / (2π)", "e.v / (πr²)"],
        ans: 0,
        hint: "💡 تلميح: I = q / T ، حيث الزمن الدوري T = 2πr / v والشحنة q = e."
      },
      {
        topic: "شدة التيار والمقاومة",
        q: "5. موصل مخروطي الشكل مقطعه متدرج من نصف قطر r إلى 2r ويمر به تيار ثابت I. النسب بين كثافة التيار J عند المقيمين هي J1 / J2 :",
        options: ["1 : 2", "4 : 1", "1 : 4", "2 : 1"],
        ans: 1,
        hint: "💡 تلميح: كثافة التيار J = I / A. وبما أن التيار ثابت فإن J تتناسب عكسياً مع المساحة A (أي عكسي مع r²)."
      },
      {
        topic: "شدة التيار والمقاومة",
        q: "6. مكعب مصمت من مادة موصلة طول ضلعه L تم إعادة تشكيله ليصبح متوازي مستطيلات أبعاده (L/2, L, 2L). أعلى مقاومة يمكن الحصول عليها بين وجهين متقابلين تكون عند إدخال التيار من الوجهين أبعادهما:",
        options: ["L/2 × L", "L/2 × 2L", "L × 2L", "جميع الأوجه متساوية"],
        ans: 0,
        hint: "💡 تلميح: لزيادة المقاومة لأقصى قيمة R = ρ L_path / A، اختار أطول مسار يمر فيه التيار وأصغر مساحة مقطع."
      },
      {
        topic: "شدة التيار والمقاومة",
        q: "7. عند زيادة درجة حرارة موصل فلزي، فإن السبب الرئيسي لزيادة المقاومة النوعية هو:",
        options: ["زيادة سعة وسرعة اهتزاز جزيئاته", "زيادة تركيز الإلكترونات الحرة", "نقصان طاقة حركة الإلكترونات", "زيادة طول الموصل"],
        ans: 0,
        hint: "💡 تلميح: زيادة الحرارة تزيد طاقة الاهتزاز في الشبكة البلورية للفلز مما يزيد معدل تصادم الإلكترونات."
      },
      {
        topic: "شدة التيار والمقاومة",
        q: "8. رسم بياني بين الشحنة q والزمن t لموصل يعطى بالعلاقة q(t) = 3t² + 2t + 5. تكون شدة التيار اللحظية عند t = 2 ثانية هي:",
        options: ["14 A", "21 A", "10 A", "12 A"],
        ans: 0,
        hint: "💡 تلميح: شدة التيار اللحظية هي المشتقة الأولى للشحنة بالنسبة للزمن I = dq/dt."
      },
      {
        topic: "شدة التيار والمقاومة",
        q: "9. موصلان A و B من نفس المادة طوليهما L1, L2 ونصف قطرهما r1, r2. إذا كانت R1 = R2 وكان L1 = 4 L2 فإن النسب بين نصف القطر r1/r2 هي:",
        options: ["2 : 1", "1 : 2", "4 : 1", "1 : 4"],
        ans: 0,
        hint: "💡 تلميح: R تتناسب مع L / r². بما أن المقاومات متساوية فإن L1 / r1² = L2 / r2²."
      },
      {
        topic: "شدة التيار والمقاومة",
        q: "10. قدرة مصباح كهربائي P مدون عليه (100W, 220V). إذا وصل بمصدر جهده 110V، فإن القدرة المستهلكة فيه تصبح (بفرض ثبوت المقاومة):",
        options: ["25 W", "50 W", "100 W", "200 W"],
        ans: 0,
        hint: "💡 تلميح: P = V² / R. عند ثبوت المقاومة، انخفاض الجهد للنصف يقلل القدرة إلى الربع."
      }
    ];

    const topics = ["شدة التيار وقانون أوم", "توصيل المقاومات وتوزيع التيار", "قانون أوم للدوائر المغلقة والتغيرات"];
    
    for (let i = 11; i <= 100; i++) {
      let currentTopic = topics[(i - 1) % 3];
      let qObj = {};

      if (i <= 33) {
        qObj = {
          topic: "شدة التيار وقانون أوم",
          q: `${i}. سلك مقاومته R، تم ثنيه من منتصفه ليتضاعف سمكه. المقاومة الجديدة للسلك تكون:`,
          options: ["R / 4", "R / 2", "2 R", "4 R"],
          ans: 0,
          hint: "💡 تلميح: ثني السلك للنصف يعني أن الطول قل للنصف والمساحة تضاعفت مرتين، فتتغير المقاومة إلى R/4."
        };
      } else if (i <= 66) {
        qObj = {
          topic: "توصيل المقاومات",
          q: `${i}. مجموعة من المقاومات المتساوية قيمة كل منها R. عند توصيلها على التوالي تكون المقاومة المكافئة X، وعند توصيلها على التوازي تكون Y. تكون قيمة R مساوية لـ:`,
          options: ["√(X · Y)", "X / Y", "X · Y", "√(X / Y)"],
          ans: 0,
          hint: "💡 تلميح: X = nR و Y = R/n. بحاصل ضرب المعادلتين: X · Y = R²."
        };
      } else {
        qObj = {
          topic: "قانون أوم للدوائر المغلقة",
          q: `${i}. بطارية ق.د.ك لها VB ومقاومتها الداخلية r. وصل معها مقاومة خارجية R = r. تكون نسبة الجهد بين قطبي البطارية إلى القوة الدفع الكهربية هي:`,
          options: ["50%", "100%", "25%", "75%"],
          ans: 0,
          hint: "💡 تلميح: V = VB - I·r. وحيث إن R = r، فإن الجهد الخارجي يتوزع بالتساوي بين R و r فأن V تكون نصف VB."
        };
      }
      rawQuestions.push(qObj);
    }

    let currentIndex = 0;
    let score = 0;
    let attempts = 0;
    const userAnswers = []; // تسجيل كل تفاصيل الإجابات

    function renderQuestion() {
      attempts = 0;
      document.getElementById('nextBtn').style.display = 'none';
      document.getElementById('hintBox').style.display = 'none';
      
      const q = rawQuestions[currentIndex];
      document.getElementById('currentQ').innerText = currentIndex + 1;
      document.getElementById('score').innerText = score;
      document.getElementById('topicTag').innerText = q.topic;
      document.getElementById('qText').innerText = q.q;

      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => handleAnswer(idx, btn);
        container.appendChild(btn);
      });
    }

    function handleAnswer(selectedIdx, btnElement) {
      const q = rawQuestions[currentIndex];

      if (selectedIdx === q.ans) {
        btnElement.classList.add('correct');
        disableAllOptions();
        
        let earnedPoints = (attempts === 0) ? 10 : 5;
        score += earnedPoints;
        
        userAnswers.push({
          questionNum: currentIndex + 1,
          selected: q.options[selectedIdx],
          correct: q.options[q.ans],
          isCorrect: true,
          attempts: attempts + 1
        });

        document.getElementById('score').innerText = score;
        document.getElementById('nextBtn').style.display = 'block';
      } else {
        if (attempts === 0) {
          attempts = 1;
          btnElement.classList.add('wrong-first');
          btnElement.disabled = true;

          const hintBox = document.getElementById('hintBox');
          hintBox.innerHTML = `⚠️ <b>إجابة خاطئة! لديك فرصة ثانية.</b><br>${q.hint}`;
          hintBox.style.display = 'block';
        } else {
          btnElement.classList.add('wrong-first');
          disableAllOptions();
          
          const buttons = document.querySelectorAll('.option-btn');
          buttons[q.ans].classList.add('correct');

          userAnswers.push({
            questionNum: currentIndex + 1,
            selected: q.options[selectedIdx],
            correct: q.options[q.ans],
            isCorrect: false,
            attempts: 2
          });

          const hintBox = document.getElementById('hintBox');
          hintBox.innerHTML = `❌ <b>للأسف إجابة خاطئة ثانية!</b> الإجابة الصحيحة هي: <b>${q.options[q.ans]}</b>`;
          hintBox.style.display = 'block';

          document.getElementById('nextBtn').style.display = 'block';
        }
      }
    }

    function disableAllOptions() {
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(b => b.disabled = true);
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex < rawQuestions.length) {
        renderQuestion();
      } else {
        showFinalResults();
      }
    }

    function sendExamResultsToFormspree(finalScore, percentage, reportSummary) {
      fetch(FORMSPREE_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          examTitle: "اختبار الفيزياء الفولاذي - 100 سؤال",
          finalScore: `${finalScore} / 1000`,
          percentage: `${percentage}%`,
          detailedAnswers: reportSummary
        })
      }).catch(err => console.log("Formspree Error:", err));
    }

    function showFinalResults() {
      document.getElementById('headerBar').style.display = 'none';
      const percentage = ((score / 1000) * 100).toFixed(1);
      
      let tableRows = userAnswers.map(ans => `
        <tr>
          <td>س${ans.questionNum}</td>
          <td>${ans.selected}</td>
          <td>${ans.correct}</td>
          <td class="${ans.isCorrect ? 'status-pass' : 'status-fail'}">
            ${ans.isCorrect ? (ans.attempts === 1 ? '✅ صح (من أول مرة)' : '⚠️ صح (فرصة ثانية)') : '❌ خطأ'}
          </td>
        </tr>
      `).join('');

      let reportSummaryForEmail = userAnswers.map(a => `س${a.questionNum}: اختار (${a.selected}) | الصح (${a.correct}) | ${a.isCorrect ? 'صح' : 'خطأ'}`).join(" | ");

      const quizBox = document.getElementById('quizBox');
      quizBox.innerHTML = `
        <div class="results-card">
          <div class="results-title">🎓 النتيجة النهائية للامتحان</div>
          <p style="font-size: 1.4rem; margin-bottom: 8px;">مجموع النقاط: <b>${score}</b> / 1000</p>
          <p style="font-size: 1.2rem; color: #38bdf8; font-weight: bold; margin-bottom: 20px;">النسبة المئوية: ${percentage}%</p>
          
          <h3 style="text-align: right; color: #f1f5f9; margin-top: 15px;">📊 كشف الإجابات التفصيلي:</h3>
          <table class="report-table">
            <thead>
              <tr>
                <th>السؤال</th>
                <th>إجابتك</th>
                <th>الإجابة الصحيحة</th>
                <th>الحالة</th>
              </tr>
            </thead>
            <tbody>
              ${tableRows}
            </tbody>
          </table>

          <button class="next-btn" style="display:block; margin-top:25px;" onclick="location.reload()">إعادة الاختبار 🔄</button>
        </div>
      `;

      sendExamResultsToFormspree(score, percentage, reportSummaryForEmail);
    }

    // خلفية النجوم المتحركة
    const canvas = document.getElementById('starsCanvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.onresize = () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    };

    const stars = Array.from({ length: 90 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      r: Math.random() * 2 + 0.5,
      alpha: Math.random()
    }));

    function drawScene() {
      ctx.clearRect(0, 0, width, height);
      stars.forEach(s => {
        ctx.fillStyle = `rgba(56, 189, 248, ${s.alpha})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
        s.alpha += (Math.random() - 0.5) * 0.02;
        if (s.alpha < 0.1) s.alpha = 0.1;
        if (s.alpha > 0.9) s.alpha = 0.9;
      });
      requestAnimationFrame(drawScene);
    }

    renderQuestion();
    drawScene();
  </script>
</body>
</html>
