<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <title>اختبار الفيزياء الفولاذي - 100 سؤال ⚡</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
    body { background: #05060d; color: #e2e8f0; min-height: 100vh; display: flex; justify-content: center; align-items: center; overflow-x: hidden; padding: 20px; }
    canvas { position: fixed; top: 0; left: 0; z-index: 1; pointer-events: none; }
    .container { position: relative; z-index: 10; width: 100%; max-width: 900px; background: rgba(13, 17, 30, 0.92); backdrop-filter: blur(20px); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 24px; padding: 35px; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 35px rgba(56, 189, 248, 0.2); }
    .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 15px; margin-bottom: 22px; }
    .progress-box { font-size: 1.05rem; color: #38bdf8; font-weight: 700; background: rgba(56, 189, 248, 0.1); padding: 8px 16px; border-radius: 20px; border: 1px solid rgba(56, 189, 248, 0.3); }
    .score-box { font-size: 1.05rem; color: #4ade80; font-weight: 700; }
    .question-card { background: rgba(255, 255, 255, 0.03); border-radius: 18px; padding: 25px; border: 1px solid rgba(255, 255, 255, 0.08); margin-bottom: 20px; box-shadow: inset 0 0 15px rgba(0,0,0,0.5); }
    .topic-tag { display: inline-block; color: #fbbf24; font-size: 0.88rem; font-weight: bold; margin-bottom: 10px; background: rgba(251, 191, 36, 0.1); padding: 4px 12px; border-radius: 12px; border: 1px solid rgba(251, 191, 36, 0.2); }
    .question-text { font-size: 1.2rem; line-height: 1.9; color: #f1f5f9; font-weight: 600; }
    .hint-box { display: none; background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; padding: 14px; border-radius: 12px; margin-bottom: 20px; font-size: 0.98rem; line-height: 1.6; }
    .options-container { display: flex; flex-direction: column; gap: 12px; }
    .option-btn { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.15); color: #fff; padding: 16px 20px; border-radius: 14px; font-size: 1.05rem; font-weight: 500; cursor: pointer; text-align: right; transition: all 0.3s ease; }
    .option-btn:hover { background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(129, 140, 248, 0.2)); border-color: #38bdf8; transform: translateX(-5px); }
    .option-btn.wrong-first { background: rgba(239, 68, 68, 0.25) !important; border-color: #ef4444 !important; opacity: 0.6; cursor: not-allowed; }
    .option-btn.correct { background: rgba(34, 197, 94, 0.3) !important; border-color: #22c55e !important; }
    .next-btn { display: none; width: 100%; margin-top: 20px; background: linear-gradient(135deg, #38bdf8, #818cf8); color: white; border: none; padding: 15px; border-radius: 14px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: transform 0.2s; }
    .next-btn:hover { transform: scale(1.02); }
    .results-card { text-align: center; padding: 10px; }
    .results-title { font-size: 2rem; color: #38bdf8; margin-bottom: 10px; font-weight: 800; }
    .report-table { width: 100%; margin-top: 25px; border-collapse: collapse; text-align: right; max-height: 400px; display: block; overflow-y: auto; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; }
    .report-table th, .report-table td { padding: 12px 15px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); font-size: 0.95rem; }
    .report-table th { background: rgba(56, 189, 248, 0.15); color: #38bdf8; position: sticky; top: 0; }
    .status-pass { color: #4ade80; font-weight: bold; }
    .status-fail { color: #f87171; font-weight: bold; }
  </style>
</head>
<body>

  <canvas id="starsCanvas"></canvas>

  <div class="container">
    <div class="header-bar" id="headerBar">
      <div class="progress-box">📌 السؤال: <span id="currentQ">1</span> / 100</div>
      <div class="score-box">🏆 النقاط: <span id="score">0</span></div>
    </div>

    <div id="quizBox">
      <div class="question-card">
        <div class="topic-tag" id="topicTag">الدرس</div>
        <div class="question-text" id="qText">جاري تحميل السؤال...</div>
      </div>

      <div class="hint-box" id="hintBox"></div>
      <div class="options-container" id="optionsContainer"></div>
      <button class="next-btn" id="nextBtn" onclick="nextQuestion()">السؤال التالي ➔</button>
    </div>
  </div>

  <script>
    const FORMSPREE_ENDPOINT = "https://formspree.io/f/mvkganog";

    // بنك 100 سؤال فريد ومميز 100% بدون أي تكرار
    const rawQuestions = [
      // --- الدرس الأول: شدة التيار، الجهد، المقاومة والمقاومة النوعية (1 - 33) ---
      { topic: "شدة التيار والمقاومة", q: "1. إذا زاد طول موصل بمقدار 200% نتيجة السحب المنتظم، فإن مقاومته الكهربية تزداد بمقدار:", options: ["300%", "400%", "800%", "900%"], ans: 2, hint: "💡 'زاد بمقدار 200%' يعني L2 = 3L1. في السحب R تتناسب مع L² فتصبح 9 أضعاف، والزيادة هي 800%." },
      { topic: "شدة التيار والمقاومة", q: "2. سلكان من نفس المادة، طول الأول ضعف طول الثاني وكتلة الثاني ضعف كتلة الأول. تكون النسبة بين مقاومتيهما R1/R2 هي:", options: ["8 : 1", "1 : 8", "4 : 1", "1 : 4"], ans: 0, hint: "💡 R = ρ·d·L²/m. بالتالي R1/R2 = (L1/L2)² × (m2/m1) = (2)² × (2) = 8." },
      { topic: "شدة التيار والمقاومة", q: "3. يدور إلكترون بسرعة v في مسار دائري نصف قطره r. شدة التيار المكافئة لحركة الإلكترون تساوي:", options: ["e·v / (2πr)", "2πr / (e·v)", "e·v·r / 2π", "e·v / (πr²)"], ans: 0, hint: "💡 I = q/T، والزمن الدوري T = 2πr/v، نعوض عن q بـ e فتصبح I = e·v/(2πr)." },
      { topic: "شدة التيار والمقاومة", q: "4. موصل مخروطي متدرج المقطع من r إلى 2r يمر به تيار ثابت I. النسبة بين كثافة التيار J عند المقطعين J1/J2 هي:", options: ["1 : 2", "4 : 1", "1 : 4", "2 : 1"], ans: 1, hint: "💡 كثافة التيار J = I/A. بما أن I ثابت، فإن J تتناسب عكسياً مع المساحة r²." },
      { topic: "شدة التيار والمقاومة", q: "5. مكعب مصمت أُعيد تشكيله ليصبح متوازي مستطيلات أبعاده (L/2, L, 2L). أكبر مقاومة تظهر عند دخول التيار من الوجه أبعاده:", options: ["L/2 × L", "L/2 × 2L", "L × 2L", "متساوية في كل الأوجه"], ans: 0, hint: "💡 R تكون أكبر ما يمكن عندما نختار أصغر مساحة مقطع وأطول مسار مرور للتيار." },
      { topic: "شدة التيار والمقاومة", q: "6. دالة الشحنة بالنسبة للزمن q(t) = 3t² + 2t + 5. شدة التيار اللحظية عند t = 3 ثوانٍ تساوي:", options: ["20 A", "11 A", "33 A", "18 A"], ans: 0, hint: "💡 I = dq/dt = 6t + 2. عند t = 3 ⟹ I = 6(3) + 2 = 20 A." },
      { topic: "شدة التيار والمقاومة", q: "7. مصباح مدون عليه (100W, 220V). إذا وصل بمصدر 110V، فإن القدرة المستهلكة فيه تصبح:", options: ["25 W", "50 W", "100 W", "200 W"], ans: 0, hint: "💡 P = V²/R. انخفاض الجهد للنصف يقلل القدرة للربع عند ثبوت المقاومة." },
      { topic: "شدة التيار والمقاومة", q: "8. إذا زاد نصف قطر سلك إلى الضعف وقل طوله للنصف، فإن التوصيلية الكهربية لمادته:", options: ["لا تتغير", "تزداد للضعف", "تقل للنصف", "تزداد لأربعة أمثال"], ans: 0, hint: "💡 التوصيلية الكهربية والمقاومة النوعية خواص مميزة للمادة تعتمد فقط على النوع والحرارة." },
      { topic: "شدة التيار والمقاومة", q: "9. سلك مقاومته R، تم ثنيه من منتصفه ليتضاعف سمكه، فتكون المقاومة الجديدة:", options: ["R / 4", "R / 2", "2 R", "4 R"], ans: 0, hint: "💡 عند ثني السلك للنصف: الطول يقل للنصف والمساحة تتضاعف، فيقل R للربع." },
      { topic: "شدة التيار والمقاومة", q: "10. موصل عبارة عن أسطوانة مجوفة طولها L ونصف قطريها الداخلي r1 والخارجي r2. مقاومته عند مرور التيار موازياً للمحور هي:", options: ["ρ·L / [π(r2² - r1²)]", "ρ·L / [π(r2 + r1)²]", "ρ·(r2 - r1) / (πL²)", "ρ·L / (2πr1r2)"], ans: 0, hint: "💡 مساحة مقطع المادة الموصلة في الأسطوانة المجوفة هي A = π(r2² - r1²)." },
      { topic: "شدة التيار والمقاومة", q: "11. الشغل المبذول لنقل شحنة قدرها 4 C بين نقطتين فرق الجهد بينهما 12 V يساوي:", options: ["48 J", "3 J", "0.33 J", "16 J"], ans: 0, hint: "💡 W = V × q = 12 × 4 = 48 Joule." },
      { topic: "شدة التيار والمقاومة", q: "12. كمية الشحنة الكهربية التي تعبر مقطع موصل يمر به تيار 5 A في زمن قدره دقيقة واحدة هي:", options: ["300 C", "5 C", "12 C", "60 C"], ans: 0, hint: "💡 q = I × t = 5 × 60 = 300 C." },
      { topic: "شدة التيار والمقاومة", q: "13. عند رفع درجة حرارة الموصلات الفلزية، فإن مقاومتها تزداد بسبب:", options: ["زيادة سعة وسرعة اهتزاز الجزيئات", "زيادة عدد الإلكترونات الحرة", "نقص سرعة الإلكترونات", "نقص التردد الاهتزازي"], ans: 0, hint: "💡 الحرارة تزيد طاقة اهتزاز الذرات فيزداد معدل تصادم الإلكترونات بها." },
      { topic: "شدة التيار والمقاومة", q: "14. سلكان A و B من نفس المادة، طول A ضعف طول B، وقطر A نصف قطر B. النسبة بين مقاومة A إلى B هي:", options: ["8 : 1", "4 : 1", "2 : 1", "1 : 2"], ans: 0, hint: "💡 R تتناسب مع L/r². إذن (L_A/L_B) × (r_B/r_A)² = 2 × (2)² = 8." },
      { topic: "شدة التيار والمقاومة", q: "15. ميل الخط المستقيم للرسم البياني بين فرق الجهد V على المحور الراسي وشدة التيار I على الأفقي يمثل:", options: ["المقاومة الكهربية R", "المقاومة النوعية", "التوصيلية الكهربية", "الشغل الكهربي"], ans: 0, hint: "💡 حسب قانون أوم V/I = R." },
      { topic: "شدة التيار والمقاومة", q: "16. إذا مر 10¹⁹ إلكترون خلال ثانية واحدة عبر مقطع موصل، تكون شدة التيار المار (علماً بأن e = 1.6×10⁻¹⁹ C):", options: ["1.6 A", "16 A", "0.16 A", "160 A"], ans: 0, hint: "💡 I = N·e / t = (10¹⁹ × 1.6×10⁻¹⁹) / 1 = 1.6 A." },
      { topic: "شدة التيار والمقاومة", q: "17. أي من الوحدات التالية لا تكافئ وحدة القاط (Watt):", options: ["J·s", "J/s", "A·V", "A²·Ω"], ans: 0, hint: "💡 القدرة تساوى J/s وليس J·s." },
      { topic: "شدة التيار والمقاومة", q: "18. سلك ألومنيوم وسلك نحاس لهما نفس الطول والمقاومة، فإن النسبة بين نصفي قطريهما r_Al / r_Cu تتناسب مع:", options: ["√(ρ_Al / ρ_Cu)", "ρ_Al / ρ_Cu", "ρ_Cu / ρ_Al", "√(ρ_Cu / ρ_Al)"], ans: 0, hint: "💡 بما أن R و L متساويان: r² تتناسب مع ρ ⟹ r تتناسب مع √ρ." },
      { topic: "شدة التيار والمقاومة", q: "19. عند زيادة شدة التيار المار في موصل للضعف، فإن مقاوته الكهربية عند ثبوت الحرارة:", options: ["تظل ثابته", "تزداد للضعف", "تقل للنصف", "تزداد للأربعة أمثال"], ans: 0, hint: "💡 المقاومة هي التي تؤثر في التيار وليس العكس." },
      { topic: "شدة التيار والمقاومة", q: "20. حاصل ضرب المقاومة النوعية لمادة في توصيليتها الكهربية يساوي:", options: ["1", "صفر", "قيمة تتوقف على الحرارة", "قيمة تتوقف على الطول"], ans: 0, hint: "💡 ρ_e × σ = 1 دائماً." },
      { topic: "شدة التيار والمقاومة", q: "21. وحدة قياس التوصيلية الكهربية هي:", options: ["Ω⁻¹·m⁻¹", "Ω·m", "Ω·m⁻¹", "Ω⁻¹·m"], ans: 0, hint: "💡 مقلوب المقاومة النوعية وحدتها Ohm⁻¹·m⁻¹." },
      { topic: "شدة التيار والمقاومة", q: "22. سلك مقاومته 10 أوم سحب فزاد طوله بمقدار 10%، تكون مقاومته الجديدة تقريباً:", options: ["12.1 أوم", "11 أوم", "12 أوم", "10.1 أوم"], ans: 0, hint: "💡 L2 = 1.1 L1 ⟹ R2 = (1.1)² × R1 = 1.21 × 10 = 12.1 Ω." },
      { topic: "شدة التيار والمقاومة", q: "23. فرق الجهد بين نقطتين عندما يلزم بذل شغل 30 جول لنقل شحنة 10 كولوم بينهما هو:", options: ["3 V", "300 V", "0.3 V", "30 V"], ans: 0, hint: "💡 V = W / q = 30 / 10 = 3 V." },
      { topic: "شدة التيار والمقاومة", q: "24. المقاومة النوعية للنحاس 1.8×10⁻⁸ Ω·m. هذا يعني أن مقاومة سلك نحاس طوله 1m ومساحته 1m² هي:", options: ["1.8×10⁻⁸ Ω", "1.8×10⁸ Ω", "1 Ω", "1.8 Ω"], ans: 0, hint: "💡 هذا هو التعريف المباشر للمقاومة النوعية." },
      { topic: "شدة التيار والمقاومة", q: "25. الطاقة الكهربية المستهلكة في موصل مقاومته R يمر به تيار I خلال زمن t هي:", options: ["I²·R·t", "I·R·t", "I·R²·t", "V·I²/t"], ans: 0, hint: "💡 Energy = P × t = I²·R·t." },
      { topic: "شدة التيار والمقاومة", q: "26. إذا قل زاوية ميل خط (V - I) لموصل، فهذا يعني أن مقاومة الموصل:", options: ["قلت", "زادت", "ظلت ثابتة", "انعدمت"], ans: 0, hint: "💡 الميل هو R، وقلة الزاوية يعني قلة الميل والمقاومة." },
      { topic: "شدة التيار والمقاومة", q: "27. اتجاه التيار الاصطلاحي يكون من:", options: ["القطب الموجب للموجب خارج المصدر", "القطب الموجب للسالب خارج المصدر", "القطب السالب للموجب خارج المصدر", "من المنتصف للطرفين"], ans: 1, hint: "💡 التيار التقليدي حركة الشحنات الموجبة من الموجب للسالب خارج المصدر." },
      { topic: "شدة التيار والمقاومة", q: "28. النسبة بين شدة التيار المار في موصل وفرق الجهد بين طرفيه تمثل:", options: ["التوصيلية الكهربية مرجحة بالمساحة للطول (1/R)", "المقاومة الكهربية R", "القدرة الكهربية", "الشغل"], ans: 0, hint: "💡 I/V = 1/R (مقلوب المقاومة)." },
      { topic: "شدة التيار والمقاومة", q: "29. يلزم بذل شغل قدره 100 J لنقل 20 C خلال 2s. تكون القدرة المستهلكة في الموصل:", options: ["50 W", "100 W", "10 W", "200 W"], ans: 0, hint: "💡 Power = W / t = 100 / 2 = 50 W." },
      { topic: "شدة التيار والمقاومة", q: "30. سلكان A و B من نفس المادة، كتلة A نصف كتلة B وطول A ضعف طول B. النسبة R_A / R_B هي:", options: ["8 : 1", "4 : 1", "2 : 1", "1 : 8"], ans: 0, hint: "💡 R ∝ L²/m ⟹ (2)² / (0.5) = 4 / 0.5 = 8." },
      { topic: "شدة التيار والمقاومة", q: "31. الموصل الكهربائي يظل متعدلاً كهربياً أثناء مرور التيار به لأن:", options: ["معدل دخول الشحنات يساوي معدل خروجها", "الإلكترونات تختفي فيه", "الجسيمات تتوقف", "الشحنات الموجبة تلتهم السالبة"], ans: 0, hint: "💡 الموصل لا يشحن لأن كمية الشحنة الداخلة = الخارجة." },
      { topic: "شدة التيار والمقاومة", q: "32. زيادة طول السلك للضعف ونقص مساحة مقطعه للنصف تؤدي لزيادة مقاومته بـ:", options: ["4 أضعاف قيمة الأصلية", "ضعفين", "3 أضعاف قيمتها الأصلية", "8 أضعاف"], ans: 2, hint: "💡 تصبح المقاومة الجديد 4R. زادت 'بمقدار' 3R (3 أضعاف)." },
      { topic: "شدة التيار والمقاومة", q: "33. عند رسم العلاقة بين R و 1/A لمجموعة أسلاك من نفس المادة ونفس الطول، فإن ميل الخط يساوي:", options: ["ρ·L", "ρ / L", "L / σ", "σ·L"], ans: 0, hint: "💡 R = (ρ·L) × (1/A). الميل هو ρ·L." },

      // --- الدرس الثاني: توصيل المقاومات (34 - 66) ---
      { topic: "توصيل المقاومات", q: "34. مجموعة مقاومات متساوية R، توالي تكافئ X وتوازي تكافئ Y. قيمة R تساوي:", options: ["√(X·Y)", "X / Y", "X·Y", "√(X / Y)"], ans: 0, hint: "💡 X = nR و Y = R/n. بحاصل ضربهما: X·Y = R² ⟹ R = √(X·Y)." },
      { topic: "توصيل المقاومات", q: "35. حلقة فلزية منتظمة مقاوتها 48 أوم، صُلت بطارية بين طرفي قطر فيها. المقاومة المكافئة تكون:", options: ["12 أوم", "24 أوم", "48 أوم", "6 أوم"], ans: 0, hint: "💡 القطر يقسم الحلقة إلى نُصفين (24 Ω و 24 Ω) متوازيين فتصبح 12 Ω." },
      { topic: "توصيل المقاومات", q: "36. 3 مقاومات (R, 2R, 3R) توازي. إذا كان تيار المقاومة R هو I، فإن التيار الكلي المار بالمجموعة يساوي:", options: ["1.83 I", "2.5 I", "6 I", "1.16 I"], ans: 0, hint: "💡 V = I·R. تيار 2R هو I/2 وتيار 3R هو I/3. المجموع = I + 0.5I + 0.33I = 1.83 I." },
      { topic: "توصيل المقاومات", q: "37. في مجموعة مقاومات توازي، المقاومة المكافئة تكون دائماً:", options: ["أقل من أصغر مقاومة", "أكبر من أكبر مقاومة", "متوسط المقاومات", "مساوية لأصغر مقاومة"], ans: 0, hint: "💡 الغرض من التوازي هو الحصول على مقاومة صغيرة من مقاومات كبيرة." },
      { topic: "توصيل المقاومات", q: "38. عند فتح مفتاح فرع متصل على التوازي في دائرة كهربائية، فإن المقاومة الكلية للدائرة:", options: ["تزداد", "تقل", "تظل ثابتة", "تنعدم"], ans: 0, hint: "💡 إلغاء مسار توازي يقلل الفروع فتزداد المقاومة المكافئة الكلية." },
      { topic: "توصيل المقاومات", q: "39. 5 مقاومات متماثلة R، أربع منها شكلت مربعاً والخامسة وُصلت على القطر. المقاومة المكافئة بين طرفي القطر هي:", options: ["R / 2", "R", "2 R", "R / 4"], ans: 0, hint: "💡 الضلعان العلويان (2R)، الضلعان السفليان (2R)، والقطر (R). توازي (2R // 2R // R) = R/2." },
      { topic: "توصيل المقاومات", q: "40. مقاومتان R1 و R2 عند توصيلهما توالي المقاومة المكافئة 25Ω وعند التوازي 4Ω. قيم المقاومتين هما:", options: ["20Ω و 5Ω", "15Ω و 10Ω", "18Ω و 7Ω", "12Ω و 13Ω"], ans: 0, hint: "💡 R1 + R2 = 25 و (R1·R2)/25 = 4 ⟹ R1·R2 = 100. العددان هما 20 و 5." },
      { topic: "توصيل المقاومات", q: "41. سلكان من نفس المادة ولهما نفس الطول، مساحة A ضعف B. عند توصيلهما توالي تكون نسبة الجهد VA / VB هي:", options: ["1 : 2", "2 : 1", "1 : 4", "4 : 1"], ans: 0, hint: "💡 التوالي ثبات التيار. V تتناسب طرديا مع R وعكسيا مع A." },
      { topic: "توصيل المقاومات", q: "42. ثلاث مقاومات متساوية قيمة كل منها 6 أوم، توصل للحصول على مقاومة مكافئة 9 أوم عن طريق:", options: ["مقاومتين توازي معهما الثالثة توالي", "مقاومتين توالي معهما الثالثة توازي", "الثلاثة توالي", "الثلاثة توازي"], ans: 0, hint: "💡 (6 // 6) = 3 أوم + 6 أوم توالي = 9 أوم." },
      { topic: "توصيل المقاومات", q: "43. سلك مقاومته 12 أوم قُسّم إلى 3 قطع متساوية ووصلت المقاطع الثلاثة على التوازي، تكون المقاومة المكافئة:", options: ["1.33 أوم", "4 أوم", "0.75 أوم", "36 أوم"], ans: 0, hint: "💡 كل قطعة قيمتها 4 أوم. توازي 3 قطع = 4 / 3 = 1.33 أوم." },
      { topic: "توصيل المقاومات", q: "44. قنطرة وهيتستون تكون متزنة (لا يمر تيار في الجلفانومتر الأوسط) عندما تكون نسبة المقاومات بين طرفيه:", options: ["R1 / R2 = R3 / R4", "R1 · R2 = R3 · R4", "R1 + R2 = R3 + R4", "R1 - R2 = R3 - R4"], ans: 0, hint: "💡 الاتزان يحدث عند تساوي جهد النقطتين المتصلتين بالجلفانومتر." },
      { topic: "توصيل المقاومات", q: "45. سلكان A و B لهما نفس المقاومة، وصل أحدهما بدائرة فتولد قدرة P. إذا وصل السلكان توالي مع نفس المصدر، فالقدرة الكلية تصبح:", options: ["P / 2", "2 P", "P / 4", "4 P"], ans: 0, hint: "💡 المقاومة تضاعفت (2R) والجهد ثابت، فتقل القدرة P = V²/R للنصف." },
      { topic: "توصيل المقاومات", q: "46. في السلكين السابقين، إذا وصلا على التوازي مع نفس المصدر، فإن القدرة الكلية تصبح:", options: ["2 P", "P / 2", "4 P", "P / 4"], ans: 0, hint: "💡 المقاومة تقل للنصف (R/2)، فتتضاعف القدرة الكلية المستهلكة لتصبح 2P." },
      { topic: "توصيل المقاومات", q: "47. لديك n من المقاومات المتماثلة قيمة كل منها R. النسبة بين المقاومة المكافئة توالي إلى توازي هي:", options: ["n²", "1 / n²", "n", "1 / n"], ans: 0, hint: "💡 R_seq = nR، R_par = R/n. النسبة = nR / (R/n) = n²." },
      { topic: "توصيل المقاومات", q: "48. شريط مقاومات إضاءة زينة يحتوي على 20 مصباحاً متصلة على التوالي. إذا احترق أحد المصابيح، فإن باقي المصابيح:", options: ["تنطفئ جميعاً", "تزداد شدة إضاءتها", "تظل تضيء بنفس الشدة", "تقل إضاءتها قليلاً"], ans: 0, hint: "💡 التوصيل التوالي يلغي التيار في الدائرة بالكامل عند قطع أي جزء." },
      { topic: "توصيل المقاومات", q: "49. توصيل المنازل بالكهرباء يتم على التوازي لضمان:", options: ["تشغيل كل جهاز بجهد المصدر المستقل وإمكانية إطفاء أحدها دون الباقي", "زيادة المقاومة الكلية للمنزل", "تقليل التيار المار في الفيشة الرئيسية", "توزيع التيار بالتساوي على الأجهزة"], ans: 0, hint: "💡 فائدة التوازي تثبيت الجهد واستقلالية تشغيل الأجهزة." },
      { topic: "توصيل المقاومات", q: "50. أربع مقاومات متساوية قيمة كل منها 10 أوم وصلوا على هيئة مربع ABCD. المقاومة المكافئة بين النقطتين A و C (قطرياً) هي:", options: ["10 أوم", "20 أوم", "5 أوم", "40 أوم"], ans: 0, hint: "💡 فرع علوي (10+10 = 20) وفرع سفلي (10+10 = 20). توازي (20 // 20) = 10 أوم." },
      { topic: "توصيل المقاومات", q: "51. في المربع السابق ABCD، المقاومة المكافئة بين A و B (ضلع متجاور) هي:", options: ["7.5 أوم", "10 أوم", "2.5 أوم", "15 أوم"], ans: 0, hint: "💡 فرع يحتوي ضلع واحد 10 أوم وفرع يحتوي 3 أضلاع (30 أوم). توازي (10×30)/40 = 7.5 أوم." },
      { topic: "توصيل المقاومات", q: "52. في دائرة تحتوي مقاومتين R و 2R توازي الموصولتين ببطارية. نسبة القدرة المستهلكة P1 / P2 في المقاومتين هي:", options: ["2 : 1", "1 : 2", "4 : 1", "1 : 4"], ans: 0, hint: "💡 P = V²/R. الجهد ثابت بالتوازي، فالقدرة تتناسب عكسياً مع R." },
      { topic: "توصيل المقاومات", q: "53. في دائرة تحتوي مقاومتين R و 2R توالي. نسبة القدرة المستهلكة P1 / P2 فيهما هي:", options: ["1 : 2", "2 : 1", "1 : 4", "4 : 1"], ans: 0, hint: "💡 P = I²·R. التيار ثابت بالتوالي، فالقدرة تتناسب طرديا مع R." },
      { topic: "توصيل المقاومات", q: "54. إذا كانت المقاومة المكافئة لثلاث مقاومات متساوية موصلة على التوازي هي 2 أوم، فإن مقاومتها المكافئة عند التوالي تكون:", options: ["18 أوم", "6 أوم", "9 أوم", "36 أوم"], ans: 0, hint: "💡 R/3 = 2 ⟹ R = 6. بالتوالي تكون 3 × 6 = 18 أوم." },
      { topic: "توصيل المقاومات", q: "55. عدد المقاومات التي قيم كل منها 40 أوم واللازم توصيلها على التوازي ليمر تيار كلي 15 A تحت فرق جهد 120 V هو:", options: ["5 مقاومات", "4 مقاومات", "6 مقاومات", "8 مقاومات"], ans: 0, hint: "💡 R_eq = 120 / 15 = 8 أوم. R_eq = R / n ⟹ 8 = 40 / n ⟹ n = 5." },
      { topic: "توصيل المقاومات", q: "56. وصل سلك مقاومته R ببطارية، ثم قُص السلك للنصف ووصل النصف بنفس البطارية. النسبة بين القدرة المستهلكة بالثاني للأول هي:", options: ["2 : 1", "1 : 2", "4 : 1", "1 : 1"], ans: 0, hint: "💡 المقاومة أصبحت R/2 والجهد ثابت ⟹ القدرة الحالية ضعفي الأولى." },
      { topic: "توصيل المقاومات", q: "57. دائرة بها مقاومتان 6Ω و 12Ω توازي موصلتان على التوالي مع مقاومة 4Ω. المقاومة المكافئة الكلية هي:", options: ["8 أوم", "22 أوم", "10 أوم", "6 أوم"], ans: 0, hint: "💡 (6 // 12) = 4 أوم. إضافة 4 أوم توالي = 8 أوم." },
      { topic: "توصيل المقاومات", q: "58. في الدائرة السابقة، إذا كان التيار الكلي المار بالدائرة هو 3 A، فإن تيار المقاومة 6Ω هو:", options: ["2 A", "1 A", "1.5 A", "3 A"], ans: 0, hint: "💡 التيار يتجزأ بنسبة عكسية: 6Ω تاخد ضعف الـ 12Ω، تاخد 2 A." },
      { topic: "توصيل المقاومات", q: "59. عندما ينعدم فرق الجهد بين طرفي مقاومة في دائرة مغلقة، فهذا يعني أن المقاومة:", options: ["ملغاة (موضوع عليها سلك عديم المقاومة توازي)", "تمر بها أقصى شدة تيار", "متصلة توالي مع المصدر", "قيمتها المادية لا نهائية"], ans: 0, hint: "💡 وجود سلك التوازي يسحب كل التيار ويجعل فرق الجهد بين طرفيها صفر." },
      { topic: "توصيل المقاومات", q: "60. ثلاث مقاومات 10Ω و 20Ω و 30Ω موصلة توازي. المقاومة الكلية تكون قطعاً أقل من:", options: ["10 أوم", "20 أوم", "30 أوم", "60 أوم"], ans: 0, hint: "💡 أصغر مقاومة فيهم هي 10 أوم، المكافئة توازي أقل من أصغر واحدة." },
      { topic: "توصيل المقاومات", q: "61. موصل كروي مجوف وموصل مصمت من نفس المادة، لهما نفس الأبعاد الخارجية. توصيلهما بنفس المصدر يجعل تيار المجوف مقارنة بالصلب:", options: ["أقل", "أكبر", "مساوٍ", "ضعف"], ans: 0, hint: "💡 مساحة مقطع المادة الموصلة في المجوف أقل، فمقاومته أعلى وتياره أقل." },
      { topic: "توصيل المقاومات", q: "62. النسبة بين التيار المار في عدة مقاومات متصلة توالي هي:", options: ["1 : 1", "بنسبة المقاومات", "عكس نسبة المقاومات", "تعتمد على القدرة"], ans: 0, hint: "💡 التيار ثابت ومتساوٍ في جميع أجزاء دائرة التوالي." },
      { topic: "توصيل المقاومات", q: "63. المقاومة المكافئة لعدد n من المقاومات المتساوية R الموصلة على التوالي هي:", options: ["n · R", "R / n", "n / R", "R^n"], ans: 0, hint: "💡 القانون المباشر للتوالي للمتماثل." },
      { topic: "توصيل المقاومات", q: "64. عند توصيل مقاومتين R و 3R توازي مع مصباح. الشدة الضوئية للمصباح تعتمد على جهد الفرع الذي هو:", options: ["ثابت لمساواته لجهد المصدر (مهمل المقاومة الداخلية)", "يتجزأ", "يتضاعف", "ينعدم"], ans: 0, hint: "💡 التوازي يثبت فرق الجهد على الأفرع." },
      { topic: "توصيل المقاومات", q: "65. سلك مقطعه متغير وصل طرفاه بمصدر. التيار المار عند المقطع الضيق مقارنة بالمقطع الواسع يكون:", options: ["متساويًا", "أكبر في الضيق", "أكبر في الواسع", "يعتمد على المقاومة النوعية"], ans: 0, hint: "💡 شحنات الكهرباء لا تتراكم، الشدة ثابتة عبر جميع مقاطع المسار التوالي." },
      { topic: "توصيل المقاومات", q: "66. أربعة مقاومات موصلة توازي، إذا كانت القراءات للأجهزة متساوية فإن قيم المقاومات تكون:", options: ["متساوية", "مختلفة", "تنازلية", "تصاعدية"], ans: 0, hint: "💡 ثبوت V و I على المقاومات يعني R متساوية." },

      // --- الدرس الثالث: قانون أوم للدوائر المغلقة (67 - 100) ---
      { topic: "قانون أوم للدوائر المغلقة", q: "67. بطارية VB ومقاومتها الداخلية r = R أُوصلت بمقاومة خارجية R. كفاءة البطارية تساوي:", options: ["50%", "100%", "25%", "75%"], ans: 0, hint: "💡 الكفاءة = R / (R + r) × 100% = R / (2R) × 100% = 50%." },
      { topic: "قانون أوم للدوائر المغلقة", q: "68. بطارية VB ومقاومتها الداخلية r أُوصلت بمقاومة خارجية R = 3r. كفاءة البطارية تساوي:", options: ["75%", "25%", "50%", "80%"], ans: 0, hint: "💡 الكفاءة = 3r / (3r + r) × 100% = 3/4 × 100% = 75%." },
      { topic: "قانون أوم للدوائر المغلقة", q: "69. عند زيادة المقاومة المتغيرة (الريوستات) في دائرة مغلقة، فإن قراءة الفولتميتر الموصل بين قطبي البطارية (ذات المقاومة الداخلية):", options: ["تزداد وتقترب من VB", "تقل وتصل للصفر", "تنعدم فوراً", "لا تتغير"], ans: 0, hint: "💡 V = VB - I·r. زيادة الريوستات تقلل I فيقل المخصوم I·r وتزداد V." },
      { topic: "قانون أوم للدوائر المغلقة", q: "70. عمود كهربائي أُوصل بمقاومة R1 فمر تيار I1، واستبدلت بمقاومة R2 فمر تيار I2. القوة الدافعة VB هي:", options: ["I1·I2·(R1 - R2) / (I2 - I1)", "I1·I2·(R2 - R1) / (I1 - I2)", "(I1·R1 - I2·R2)", "(I1·R2 - I2·R1)"], ans: 0, hint: "💡 ساوِ VB = I1(R1 + r) = I2(R2 + r) ثم احسب r وعوض لتعطى العبارة الأولى." },
      { topic: "قانون أوم للدوائر المغلقة", q: "71. دائرة مغلقة تحتوى على بطارية r = 0. فرق الجهد بين قطبيها ينخفض عن VB بمقدار:", options: ["صفر", "I·r", "VB / 2", "I·R"], ans: 0, hint: "💡 عندما تكون المقاومة الداخلية مهملة (r = 0)، يكون V = VB دائماً." },
      { topic: "قانون أوم للدوائر المغلقة", q: "72. بطاريتان متصلتان على التوازي القوة الدافعة لكل منهما VB والمقاومة الداخلية r. المكافئ للبطاريتين هو:", options: ["VB و r/2", "2VB و 2r", "VB و r", "2VB و r/2"], ans: 0, hint: "💡 التوصيل التوازي للبطاريات المتماثلة يثبت القوة الدافعة ويزود السعة وتقسم المقاومة r/2." },
      { topic: "قانون أوم للدوائر المغلقة", q: "73. النسبة بين القوة الدافعة الكهربية VB لبطارية وفرق الجهد بين قطبيها V في حالة التفريغ المباشر لتيار تكون:", options: ["أكبر من الواحد الصحيح", "أقل من الواحد الصحيح", "تساوي الواحد الصحيح", "تساوي الصفر"], ans: 0, hint: "💡 VB = V + I·r ⟹ VB > V ⟹ النسب أكبر من 1." },
      { topic: "قانون أوم للدوائر المغلقة", q: "74. عند فتح الدائرة الكهربية الخارجية لبطارية، فإن فرق الجهد بين قطبيها يصبح:", options: ["مساوياً للقوة الدافعة VB", "صفراً", "أكبر من VB", "نصف قيمة VB"], ans: 0, hint: "💡 عند فتح الدائرة I = 0 فتصبح V = VB." },
      { topic: "قانون أوم للدوائر المغلقة", q: "75. في حالة شحن بطارية (يدخل التيار إليها من قطبها الموجب)، يكون فرق الجهد بين قطبيها V مقارنة بـ VB:", options: ["أكبر من VB", "أقل من VB", "مساوياً لـ VB", "منعدماً"], ans: 0, hint: "💡 في حالة الشحن V = VB + I·r ⟹ V أكبر من VB." },
      { topic: "قانون أوم للدوائر المغلقة", q: "76. بطارية VB = 12 V ومقاومتها الداخلية r = 1 Ω وُصلت بمقاومة خارجية 5 Ω. شدة التيار المار بالدائرة تكون:", options: ["2 A", "2.4 A", "12 A", "1 A"], ans: 0, hint: "💡 I = VB / (R + r) = 12 / (5 + 1) = 12 / 6 = 2 A." },
      { topic: "قانون أوم للدوائر المغلقة", q: "77. في السؤال السابق، فرق الجهد بين قطبي البطارية أثناء المرور يساوي:", options: ["10 V", "12 V", "2 V", "5 V"], ans: 0, hint: "💡 V = VB - I·r = 12 - (2 × 1) = 10 V." },
      { topic: "قانون أوم للدوائر المغلقة", q: "78. بطاريتان متصلتان توالي في نفس الاتجاه (موجب بالأولى مع سالب الثانية) قوتهما الدافعة VB1 و VB2. القوة الدافعة الكلية:", options: ["VB1 + VB2", "VB1 - VB2", "VB1 × VB2", "صفر"], ans: 0, hint: "💡 التوصيل التدافعي (التوالي السليم) يجمع القوى الدافعة." },
      { topic: "قانون أوم للدوائر المغلقة", q: "79. بطاريتان متصلتان توالي في اتجاهين متضادين (موجب بالموجب) VB1 > VB2. القوة الدافعة الكلية للمجموعة:", options: ["VB1 - VB2", "VB1 + VB2", "VB1 / VB2", "صفر"], ans: 0, hint: "💡 التوصيل التضادي يطرح القوى الدافعة." },

      { topic: "قانون أوم للدوائر المغلقة", q: "100. المفهوم العلمي لـ 'مجموع فروق الجهد الكهربية في دائرة مغلقة يساوي المجموع الكلي للقوى الدافعة' هو قانون أوم للدائرة المغلقة ويستند أساساً لحفظ:", options: ["الطاقة", "الشحنة", "الكمية", "المادة"], ans: 0, hint: "💡 قانون أوم للدوائر المغلقة صياغة مبسطة لمبدأ بقاء الطاقة الكهربية." }
    ];

    let currentIndex = 0;
    let score = 0;
    let attempts = 0;
    const userAnswers = [];

    function renderQuestion() {
      attempts = 0;
      document.getElementById('nextBtn').style.display = 'none';
      document.getElementById('hintBox').style.display = 'none';
      
      const q = rawQuestions[currentIndex];
      document.getElementById('currentQ').innerText = currentIndex + 1;
      document.getElementById('score').innerText = score;
      document.getElementById('topicTag').innerText = q.topic;
      document.getElementById('qText').innerText = q.q;

      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => handleAnswer(idx, btn);
        container.appendChild(btn);
      });
    }

    function handleAnswer(selectedIdx, btnElement) {
      const q = rawQuestions[currentIndex];

      if (selectedIdx === q.ans) {
        btnElement.classList.add('correct');
        disableAllOptions();
        
        let earnedPoints = (attempts === 0) ? 10 : 5;
        score += earnedPoints;
        
        userAnswers.push({
          questionNum: currentIndex + 1,
          selected: q.options[selectedIdx],
          correct: q.options[q.ans],
          isCorrect: true,
          attempts: attempts + 1
        });

        document.getElementById('score').innerText = score;
        document.getElementById('nextBtn').style.display = 'block';
      } else {
        if (attempts === 0) {
          attempts = 1;
          btnElement.classList.add('wrong-first');
          btnElement.disabled = true;

          const hintBox = document.getElementById('hintBox');
          hintBox.innerHTML = `⚠️️ <b>إجابة خاطئة! لديك فرصة ثانية.</b><br>${q.hint}`;
          hintBox.style.display = 'block';
        } else {
          btnElement.classList.add('wrong-first');
          disableAllOptions();
          
          const buttons = document.querySelectorAll('.option-btn');
          buttons[q.ans].classList.add('correct');

          userAnswers.push({
            questionNum: currentIndex + 1,
            selected: q.options[selectedIdx],
            correct: q.options[q.ans],
            isCorrect: false,
            attempts: 2
          });

          const hintBox = document.getElementById('hintBox');
          hintBox.innerHTML = `❌ <b>للأسف إجابة خاطئة ثانية!</b> الإجابة الصحيحة هي: <b>${q.options[q.ans]}</b>`;
          hintBox.style.display = 'block';

          document.getElementById('nextBtn').style.display = 'block';
        }
      }
    }

    function disableAllOptions() {
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(b => b.disabled = true);
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex < rawQuestions.length) {
        renderQuestion();
      } else {
        showFinalResults();
      }
    }

    function sendExamResultsToFormspree(finalScore, percentage, reportSummary) {
      fetch(FORMSPREE_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          examTitle: "اختبار الفيزياء الفولاذي - 100 سؤال كاملة",
          finalScore: `${finalScore} / 1000`,
          percentage: `${percentage}%`,
          detailedAnswers: reportSummary
        })
      }).catch(err => console.log("Formspree Error:", err));
    }

    function showFinalResults() {
      document.getElementById('headerBar').style.display = 'none';
      const maxScore = 1000;
      const percentage = ((score / maxScore) * 100).toFixed(1);
      
      let tableRows = userAnswers.map(ans => `
        <tr>
          <td>س${ans.questionNum}</td>
          <td>${ans.selected}</td>
          <td>${ans.correct}</td>
          <td class="${ans.isCorrect ? 'status-pass' : 'status-fail'}">
            ${ans.isCorrect ? (ans.attempts === 1 ? '✅ صح (من أول مرة)' : '⚠️ صح (فرصة ثانية)') : '❌ خطأ'}
          </td>
        </tr>
      `).join('');

      let reportSummaryForEmail = userAnswers.map(a => `س${a.questionNum}: اختار (${a.selected}) | الصح (${a.correct}) | ${a.isCorrect ? 'صح' : 'خطأ'}`).join(" | ");

      const quizBox = document.getElementById('quizBox');
      quizBox.innerHTML = `
        <div class="results-card">
          <div class="results-title">🎓 النتيجة النهائية للامتحان</div>
          <p style="font-size: 1.4rem; margin-bottom: 8px;">مجموع النقاط: <b>${score}</b> / ${maxScore}</p>
          <p style="font-size: 1.2rem; color: #38bdf8; font-weight: bold; margin-bottom: 20px;">النسبة المئوية: ${percentage}%</p>
          
          <h3 style="text-align: right; color: #f1f5f9; margin-top: 15px;">📊 كشف الإجابات التفصيلي:</h3>
          <table class="report-table">
            <thead>
              <tr>
                <th>السؤال</th>
                <th>إجابتك</th>
                <th>الإجابة الصحيحة</th>
                <th>الحالة</th>
              </tr>
            </thead>
            <tbody>
              ${tableRows}
            </tbody>
          </table>

          <button class="next-btn" style="display:block; margin-top:25px;" onclick="location.reload()">إعادة الاختبار 🔄</button>
        </div>
      `;

      sendExamResultsToFormspree(score, percentage, reportSummaryForEmail);
    }

    // خلفية النجوم المتحركة
    const canvas = document.getElementById('starsCanvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.onresize = () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    };

    const stars = Array.from({ length: 90 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      r: Math.random() * 2 + 0.5,
      alpha: Math.random()
    }));

    function drawScene() {
      ctx.clearRect(0, 0, width, height);
      stars.forEach(s => {
        ctx.fillStyle = `rgba(56, 189, 248, ${s.alpha})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
        s.alpha += (Math.random() - 0.5) * 0.02;
        if (s.alpha < 0.1) s.alpha = 0.1;
        if (s.alpha > 0.9) s.alpha = 0.9;
      });
      requestAnimationFrame(drawScene);
    }

    renderQuestion();
    drawScene();
  </script>
</body>
</html>
