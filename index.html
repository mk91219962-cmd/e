    const FORMSPREE_ENDPOINT = "https://formspree.io/f/mvkganog";

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq = 440, type = 'sine', duration = 0.1) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e){}
    }

    let totalSeconds = 900;
    const timerElement = document.getElementById('timer');
    const playerHistory = [];

    const timerInterval = setInterval(() => {
      let minutes = Math.floor(totalSeconds / 60);
      let seconds = totalSeconds % 60;
      seconds = seconds < 10 ? '0' + seconds : seconds;
      timerElement.innerText = `${minutes}:${seconds}`;
      
      if (totalSeconds <= 0) {
        clearInterval(timerInterval);
        showTimeoutEnding();
      } else {
        totalSeconds--;
      }
    }, 1000);

    let statusScore = 100;
    const statusElement = document.getElementById('status');

    function updateStatus(val) {
      statusScore = Math.max(0, Math.min(100, statusScore + val));
      statusElement.innerText = `${statusScore}%`;
    }

    function sendResultsToFormspree(endingTitle, endingText) {
      const timeSpentMinutes = Math.floor((900 - totalSeconds) / 60);
      const timeSpentSeconds = (900 - totalSeconds) % 60;

      fetch(FORMSPREE_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          ending: endingTitle,
          finalStatus: `${statusScore}%`,
          timeSpent: `${timeSpentMinutes} دقيقة و ${timeSpentSeconds} ثانية`,
          choicesHistory: playerHistory.join(" ➔ ")
        })
      }).catch(err => console.log("Formspree Error:", err));

    function renderNode(nodeKey) {
      const node = storyNodes[nodeKey] || storyNodes['ch1'];
      const storyTextEl = document.getElementById('storyText');
      const chapterTagEl = document.getElementById('chapterTag');
      const choicesContainerEl = document.getElementById('choicesContainer');

      storyTextEl.style.opacity = 0;
      choicesContainerEl.innerHTML = "";

      playBeep(600, 'sine', 0.12);

      setTimeout(() => {
        if (node.isEnding) {
          clearInterval(timerInterval);
          playBeep(880, 'square', 0.4);

          chapterTagEl.innerText = "نهاية المهمة";
          storyTextEl.innerHTML = `
            <div class="ending-card">
              <div class="ending-title">${node.title}</div>
              <p style="line-height:2; font-size:1.2rem; color:#f1f5f9;">${node.text}</p>
              <button class="restart-btn" onclick="location.reload()">بدء مهمة جديدة 🚀</button>
            </div>
          `;
          storyTextEl.style.opacity = 1;
          
          sendResultsToFormspree(node.title, node.text);
          return;
        }

        chapterTagEl.innerText = node.chapter || "مهمة جارية";
        storyTextEl.innerText = node.text;
        storyTextEl.style.opacity = 1;

        if (node.choices) {
          node.choices.forEach(choice => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.innerText = choice.text;
            btn.onclick = () => {
              playBeep(450, 'triangle', 0.08);
              playerHistory.push(choice.text);
              if (choice.score) updateStatus(choice.score);
              renderNode(choice.nextNode);
            };
            choicesContainerEl.appendChild(btn);
          });
        }
      }, 300);
    }

    function showTimeoutEnding() {
      const gameBox = document.getElementById('gameBox');
      gameBox.innerHTML = `
        <div class="ending-card">
          <div class="ending-title">⌛ نفد وقت المهمة!</div>
          <p class="story-text">استغرقت وقتاً طويلاً في التفكير وانقطعت الاتصالات مع المحطة..</p>
          <button class="restart-btn" onclick="location.reload()">إعادة المحاولة 🔄</button>
        </div>
      `;
      sendResultsToFormspree("نفاد الوقت (Timeout)", "لم تكتمل المهمة خلال 15 دقيقة");
    }

    const canvas = document.getElementById('starsCanvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.onresize = () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    };

    const stars = Array.from({ length: 110 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      r: Math.random() * 2 + 0.5,
      alpha: Math.random()
    }));

    function drawScene() {
      ctx.clearRect(0, 0, width, height);
      stars.forEach(s => {
        ctx.fillStyle = `rgba(56, 189, 248, ${s.alpha})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
        s.alpha += (Math.random() - 0.5) * 0.02;
        if (s.alpha < 0.1) s.alpha = 0.1;
        if (s.alpha > 0.9) s.alpha = 0.9;
      });
      requestAnimationFrame(drawScene);
    }

    renderNode('ch1');
    drawScene();
  </script>
